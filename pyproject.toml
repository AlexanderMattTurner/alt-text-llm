[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-text-llm"
dynamic = ["version"]
description = "AI-powered accessibility text generation and labeling tools for markdown content"
readme = "README.md"
authors = [{name = "TurnTrout"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["alt-text", "accessibility", "markdown", "llm", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Adaptive Technologies",
]

dependencies = [
    "gitpython>=3.1",
    "requests>=2.28",
    "ruamel.yaml>=0.17",
    "markdown-it-py>=2",
    "rich>=13",
    "prompt_toolkit>=3",
    "beautifulsoup4>=4.11",
    "argcomplete>=3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    # Pin the linters exactly. CI installs this list and gates on `ruff check`
    # and `mypy`, so an unpinned entry lets a new upstream release add a rule
    # and redden every open PR without a line of this repo changing — which is
    # what happened: ruff 0.16 reported 19 findings that 0.14.5 does not, and
    # every PR went red at once. Bump these deliberately, fixing what the new
    # version reports in the same change.
    "mypy==2.3.0",
    "types-requests",
    "ruff==0.16.3",
]

[tool.uv]
# `.claude/hooks/pre-push-check.sh` runs `uv run ruff check .`, and `uv run`
# does not install [project.optional-dependencies] — so ruff was absent from the
# environment on any machine that had not already synced the dev extra, and the
# hook died with "Failed to spawn: ruff". uv installs this group by default.
# Same pin as the dev extra and .pre-commit-config.yaml; move all three together.
dev-dependencies = ["ruff==0.16.3"]

[tool.pytest.ini_options]
addopts = "--cov=alt_text_llm --cov-report=html -n auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
alt-text-llm = "alt_text_llm.main:main"

[project.urls]
Homepage = "https://github.com/alexander-turner/alt-text-llm"
Repository = "https://github.com/alexander-turner/alt-text-llm"
Issues = "https://github.com/alexander-turner/alt-text-llm/issues"
Documentation = "https://github.com/alexander-turner/alt-text-llm#readme"

[tool.setuptools]
# Prevent setuptools from trying to auto-package unrelated top-level directories
# like ./plans/.
packages = ["alt_text_llm"]
include-package-data = true

[tool.setuptools.package-data]
alt_text_llm = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "alt_text_llm.__version__"}
